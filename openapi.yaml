openapi: 3.1.0
info:
  title: Betting Stock API
  description: Minimal Custom GPT Action schema for betting event lookup.
  version: 2.0.0
servers:
  - url: https://betting-stock-api-code-integration.onrender.com
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Health Check
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/debug/config:
    get:
      operationId: debugConfig
      summary: Debug Config
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/betting/events/active:
    get:
      operationId: getActiveBettingEvents
      summary: Get Active Betting Events
      security:
        - ApiKeyAuth: []
      parameters:
        - name: league
          in: query
          required: true
          description: League code such as mlb, nba, nhl, nfl
          schema:
            type: string
            example: mlb
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/betting/first-event-odds:
    get:
      operationId: getFirstEventOdds
      summary: Get First Event Odds
      security:
        - ApiKeyAuth: []
      parameters:
        - name: league
          in: query
          required: true
          description: League code such as mlb, nba, nhl, nfl
          schema:
            type: string
            example: mlb
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
components:
  schemas: {}
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
