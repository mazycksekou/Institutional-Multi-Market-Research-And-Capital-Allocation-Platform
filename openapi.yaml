openapi: 3.1.0
info:
  title: Betting Stock API Custom GPT Actions
  description: Custom GPT Action schema for sport-model analysis and sportsbook screenshot ticket analysis.
  version: 2.1.0
servers:
  - url: https://betting-stock-api-code-integration.onrender.com
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    FlexibleObject:
      type: object
      additionalProperties: true
    SportAnalysisRequest:
      type: object
      additionalProperties: true
      properties:
        sport:
          description: Official sport key or common alias, such as nba, nfl, mlb, nhl, soccer, boxing, or esports.
          type:
            - string
            - "null"
        league:
          description: Optional league or sport key.
          type:
            - string
            - "null"
        market:
          description: Market to analyze, such as moneyline, spread, total, player_prop, live, or alt_line.
          type:
            - string
            - "null"
        event_id:
          description: Optional event identifier or event label.
          type:
            - string
            - "null"
        home_team:
          type:
            - string
            - "null"
        away_team:
          type:
            - string
            - "null"
        player_name:
          type:
            - string
            - "null"
        odds_american:
          description: American odds for the selected market.
          type:
            - integer
            - number
            - string
            - "null"
        line:
          description: Spread, total, prop, or alternate line value.
          type:
            - integer
            - number
            - string
            - "null"
        input_stats:
          description: Optional independent model inputs. Missing required inputs should return partial or inactive model status, not a server error.
          type:
            - object
            - "null"
          additionalProperties: true
        risk_profile:
          type:
            - string
            - "null"
          enum:
            - conservative
            - standard
            - aggressive
            - null
        bankroll:
          type:
            - integer
            - number
            - string
            - "null"
        unit_size:
          type:
            - integer
            - number
            - string
            - "null"
    ScreenshotAnalysisRequest:
      type: object
      additionalProperties: true
      properties:
        source_type:
          description: Source mode, such as chatgpt_parsed, parsed_fields, screenshot_text, ocr_text, or image_metadata.
          type:
            - string
            - "null"
        sport:
          description: Sport key or alias, such as nba, nfl, mlb, nhl, soccer, boxing, ufc, mma, valorant, csgo, or lol.
          type:
            - string
            - "null"
        league:
          description: League key or alias, such as nba, nfl, mlb, nhl, epl, ucl, or cfb.
          type:
            - string
            - "null"
        event:
          description: Event or game name visible in the screenshot.
          type:
            - string
            - "null"
        teams:
          description: Teams visible in the screenshot.
          type:
            - array
            - "null"
          items:
            type: string
        market:
          description: Market type, such as moneyline, spread, total, team_total, player_prop, first_half, first_quarter, first_5_innings, live, alt_line, or kalshi_prediction_market.
          type:
            - string
            - "null"
        selection:
          description: Team, player, side, over/under, or outcome selected.
          type:
            - string
            - "null"
        odds_american:
          description: American odds visible on the ticket.
          type:
            - integer
            - number
            - string
            - "null"
        line:
          description: Spread, prop, or alternate line value.
          type:
            - integer
            - number
            - string
            - "null"
        total_line:
          description: Total points/runs/goals line when the market is a total.
          type:
            - integer
            - number
            - string
            - "null"
        book:
          description: Sportsbook name visible in the screenshot.
          type:
            - string
            - "null"
        screenshot_text:
          description: Text read from the screenshot by ChatGPT or OCR. OCR is optional.
          type:
            - string
            - "null"
        visible_markets:
          description: Markets visible in the screenshot.
          type:
            - array
            - "null"
          items:
            type:
              - string
              - object
            additionalProperties: true
        visible_props:
          description: Player props visible in the screenshot.
          type:
            - array
            - "null"
          items:
            type:
              - string
              - object
            additionalProperties: true
        visible_alt_lines:
          description: Alternate lines visible in the screenshot.
          type:
            - array
            - "null"
          items:
            type:
              - string
              - object
            additionalProperties: true
        bankroll:
          type:
            - integer
            - number
            - string
            - "null"
        unit_size:
          type:
            - integer
            - number
            - string
            - "null"
        risk_profile:
          type:
            - string
            - "null"
          enum:
            - conservative
            - standard
            - aggressive
            - null
        input_stats:
          description: Optional independent model inputs. Missing required inputs should return partial_model_mode.
          type:
            - object
            - "null"
          additionalProperties: true
security:
  - ApiKeyAuth: []
paths:
  /api/actions/models/sport-analysis:
    post:
      operationId: analyzeSportModel
      summary: Analyze Sport Model
      description: Return sport-model analysis, no-bet flags, missing inputs, and model governance status. Missing model data should return inactive or partial status rather than a server error.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SportAnalysisRequest"
      responses:
        "200":
          description: Sport model analysis response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          description: Error response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/actions/ticket/screenshot-analysis:
    post:
      operationId: analyzeTicketScreenshot
      summary: Analyze Ticket Screenshot
      description: Analyze sportsbook ticket fields parsed from a screenshot or OCR text. OCR is optional; ChatGPT may send structured parsed fields directly.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreenshotAnalysisRequest"
      responses:
        "200":
          description: Screenshot ticket analysis response. The object is intentionally flexible for Custom GPT compatibility.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          description: Error response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
