name: Repository Validation

on:
  push:
    branches:
      - phase-6-api-slimming
      - main
  pull_request:
    branches:
      - phase-6-api-slimming
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi

      - name: Compile repository
        run: python -m compileall src tests scripts

      - name: Check root markdown
        run: python scripts/check_root_markdown.py

      - name: Validate OpenAPI contract
        run: python scripts/check_openapi_contract.py --output text

      - name: Validate architecture
        run: python scripts/check_architecture.py --output text

      - name: Run local ops check
        run: python scripts/ops_check.py --mode local --output text --skip-network

      - name: Run smoke tests
        run: pytest -m smoke -q
